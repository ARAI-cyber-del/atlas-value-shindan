<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>フェーズⅠ 商品開発 自己診断ツール</title>
<style>
  :root{
    --navy:#1F3A5F;
    --gold:#B8860B;
    --gray:#555;
    --lightgray:#F2F2F2;
    --bad:#C0392B;
    --mid:#B8860B;
    --good:#2E7D32;
  }
  html{
    scroll-behavior: smooth;
  }
  body{
    font-family:"Hiragino Kaku Gothic ProN","游ゴシック",sans-serif;
    background:#fafafa;
    color:#222;
    max-width:780px;
    margin:0 auto;
    padding:32px 20px 100px;
    line-height:1.7;
  }
  h1{
    color:var(--navy);
    font-size:22px;
    border-bottom:4px solid var(--navy);
    padding-bottom:10px;
  }
  .lead{
    background:var(--lightgray);
    padding:14px 16px;
    border-radius:6px;
    margin-bottom:28px;
    font-size:14px;
  }
  .catblock{
    margin-top:56px;
  }
  .catheader{
    background:var(--navy);
    color:#fff;
    padding:14px 18px;
    border-radius:8px 8px 0 0;
    font-size:19px;
    font-weight:bold;
  }
  .catlead{
    background:#EDF1F5;
    padding:12px 18px;
    font-size:13.5px;
    color:#333;
    border-bottom:1px solid #ddd;
  }
  .item{
    border:1px solid #ddd;
    border-top:none;
    padding:18px 20px;
    background:#fff;
  }
  .item h2{
    font-size:15.5px;
    color:var(--navy);
    margin:0 0 8px;
  }
  .q{
    color:var(--gold);
    font-weight:bold;
    font-size:13.5px;
  }
  .why{
    font-size:13px;
    color:var(--gray);
    margin:6px 0 14px;
  }
  .scorebar{
    display:flex;
    gap:6px;
    margin-bottom:12px;
    align-items:stretch;
  }
  .scorebar button{
    flex:1;
    padding:9px 5px 10px;
    border:2px solid #ccc;
    background:#fff;
    border-radius:6px;
    cursor:pointer;
    color:#888;
    transition:.15s;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .scorebar button .scalelabel{
    font-size:12px;
    font-weight:normal;
    line-height:1.4;
    text-align:center;
  }
  .scorebar button:hover{ border-color: var(--navy); }
  .scorebar button.selected{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }
  .comment{
    display:none;
    padding:11px 14px;
    border-radius:6px;
    font-size:13.5px;
    border-left:5px solid #999;
  }
  .comment.show{ display:block; }
  .comment.bad{ background:#FDECEA; border-left-color:var(--bad); color:#7a2015; }
  .comment.mid{ background:#FBF3E1; border-left-color:var(--mid); color:#6b5108; }
  .comment.good{ background:#EAF4EB; border-left-color:var(--good); color:#1e5322; }
  .comment a{ text-decoration:underline; }

  .catfooter{
    border:1px solid #ddd;
    border-top:none;
    border-radius:0 0 8px 8px;
    background:#F7F9FB;
    padding:16px 20px;
  }
  .cattotal{
    font-weight:bold;
    font-size:15px;
    color:var(--navy);
    margin-bottom:8px;
  }
  .catcomment{
    font-size:13.5px;
    color:#333;
  }

  #finalSummary{
    margin-top:70px;
    padding:26px;
    background:var(--navy);
    color:#fff;
    border-radius:12px;
  }
  #finalSummary h2{ margin-top:0; font-size:20px; color:#fff; }
  #totalScoreAll{ font-size:36px; font-weight:bold; color:#FFD27F; }
  #goStatus{
    display:inline-block;
    margin-left:14px;
    padding:4px 14px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
  }
  .go-good{ background:#2E7D32; }
  .go-mid{ background:#B8860B; }
  .go-bad{ background:#C0392B; }
  #finalSummaryComment{
    margin-top:18px;
    background:rgba(255,255,255,0.08);
    padding:16px 18px;
    border-radius:6px;
    font-size:14.5px;
  }
  .radarwrap{
    display:flex;
    justify-content:center;
    margin-top:20px;
  }
  .summarytop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:20px;
    margin-top:10px;
  }
  .scoreblock{
    font-size:16px;
  }
  .legendblock{
    background:rgba(255,255,255,0.08);
    border-radius:8px;
    padding:12px 16px;
    font-size:12.5px;
    min-width:250px;
    flex:1;
    max-width:320px;
  }
  .legendtitle{
    font-weight:bold;
    font-size:12.5px;
    color:#FFD27F;
    margin-bottom:8px;
  }
  .legendrow{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
    line-height:1.5;
  }
  .legenddot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
  }
  .note{
    font-size:12px;
    color:#999;
    margin-top:50px;
    text-align:center;
  }
  .progress{
    position:sticky;
    top:0;
    background:#fafafa;
    padding:8px 0;
    font-size:12px;
    color:var(--gray);
    z-index:10;
    border-bottom:1px solid #eee;
  }
</style>
</head>

<div class="lead">

</div>

  </div>
  <div id="finalSummaryComment">全項目に回答すると、ここに総合診断が表示されます。</div>
</div>

// ---------- Build DOM ----------
const allScores = {}; // key: "1-1" etc -> score
const container = document.getElementById("categories");
const TOTAL_ITEMS = categories.reduce((a,c)=>a+c.items.length,0);

categories.forEach(cat => {
  const block = document.createElement("div");
  block.className = "catblock";
  block.innerHTML = `
    <div class="catheader">カテゴリ${cat.no}　${cat.name}</div>
    <div class="catlead">${cat.lead}</div>
  `;
  const itemsWrap = document.createElement("div");

  cat.items.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.id = `item-${item.no}`;
    div.innerHTML = `
      <h2>${item.no}. ${item.name}</h2>
      <div class="q">診断質問：${item.q}</div>
      <div class="why">見落とされがちな理由：${item.why}</div>
      <div class="scorebar">
        ${[1,2,3,4,5].map(n => `<button data-score="${n}"><span class="scalelabel">${item.scale[n]}</span></button>`).join("")}
      </div>
      <div class="comment" id="comment-${item.no}"></div>
    `;
    itemsWrap.appendChild(div);

    const buttons = div.querySelectorAll(".scorebar button");
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        const score = parseInt(btn.dataset.score);
        allScores[item.no] = score;

        const tier = score <= 2 ? "bad" : (score === 3 ? "mid" : "good");
        const commentBox = document.getElementById(`comment-${item.no}`);
        commentBox.className = `comment show ${tier}`;
        commentBox.innerHTML = item.comments[tier];

        updateCategoryFooter(cat);
        updateProgress();
        updateFinalSummary();
      });
    });
  });
  block.appendChild(itemsWrap);

  const footer = document.createElement("div");
  footer.className = "catfooter";
  footer.id = `catfooter-${cat.no}`;
  footer.innerHTML = `<div class="cattotal">カテゴリ${cat.no} 合計点：<span id="cattotalval-${cat.no}">0</span> / 25点</div><div class="catcomment" id="catcomment-${cat.no}">全項目に回答すると、コメントが表示されます。</div>`;
  block.appendChild(footer);

  container.appendChild(block);
});

function updateCategoryFooter(cat){
  const vals = cat.items.map(item => allScores[item.no]).filter(v => v !== undefined);
  const total = vals.reduce((a,b)=>a+b,0);
  document.getElementById(`cattotalval-${cat.no}`).textContent = total;

  if (vals.length < cat.items.length){
    document.getElementById(`catcomment-${cat.no}`).textContent = `あと${cat.items.length - vals.length}項目、回答してください。`;
    return;
  }
  const weak = cat.items.filter(item => allScores[item.no] <= 2).map(item => item.name);
  let msg = "";
  if (total >= 20){
    msg = "このカテゴリの土台は非常に強固です。自信を持って次のカテゴリに進んでください。";
  } else if (total >= 12){
    msg = "全体としては良好ですが、一部に見直しの余地があります。";
    if (weak.length) msg += `特に「${weak.join("」「")}」の項目は、優先的に見直すことをお勧めします。`;
  } else {
    msg = "このカテゴリの土台を、一度立ち止まって再検討することをお勧めします。";
    if (weak.length) msg += `中でも「${weak.join("」「")}」は、企画の土台を左右する重要な項目です。`;
  }
  document.getElementById(`catcomment-${cat.no}`).textContent = msg;
}

function updateProgress(){
  const answered = Object.keys(allScores).length;
  document.getElementById("progress").textContent = `${answered} / ${TOTAL_ITEMS} 項目 回答済み`;
}

// ---------- Final radar (11 axes = categories) ----------
function drawFinalRadar(catAverages){
  const canvas = document.getElementById("finalRadar");
  const ctx = canvas.getContext("2d");
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = 130;
  const n = categories.length;
  const maxVal = 5;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  for (let ring = 1; ring <= maxVal; ring++){
    const r = radius * (ring / maxVal);
    ctx.beginPath();
    for (let i = 0; i <= n; i++){
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      const x = cx + r*Math.cos(angle);
      const y = cy + r*Math.sin(angle);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  for (let i = 0; i < n; i++){
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const x = cx + radius*Math.cos(angle);
    const y = cy + radius*Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(x,y);
    ctx.stroke();

    const lx = cx + (radius+30)*Math.cos(angle);
    const ly = cy + (radius+30)*Math.sin(angle);
    const shortNames = ["ターゲット","顕在/潜在ニーズ","現場観察","競合把握","業界シーズ","自社資産","トレンド整合","海外/異業種","独自性検証","特許知財","一次スクリーニング"];
    const label1 = "カテゴリ" + categories[i].no;
    const label2 = shortNames[i];
    ctx.fillText(label1, lx, ly - 6);
    ctx.font = "11px sans-serif";
    ctx.fillText(label2, lx, ly + 9);
    ctx.font = "bold 12px sans-serif";
  }

  if (catAverages.some(v => v > 0)){
    ctx.beginPath();
    catAverages.forEach((v,i) => {
      const r = radius * (v/maxVal);
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      const x = cx + r*Math.cos(angle);
      const y = cy + r*Math.sin(angle);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = "rgba(184,134,11,0.28)";
    ctx.fill();
    ctx.strokeStyle = "#B8860B";
    ctx.lineWidth = 2;
    ctx.stroke();

    catAverages.forEach((v,i) => {
      const r = radius * (v/maxVal);
      const angle = (Math.PI*2*i/n) - Math.PI/2;
      const x = cx + r*Math.cos(angle);
      const y = cy + r*Math.sin(angle);
      ctx.beginPath();
      ctx.arc(x,y,3.5,0,Math.PI*2);
      ctx.fillStyle = "#B8860B";
      ctx.fill();
    });
  }
}

function getUnansweredItems(){
  const list = [];
  categories.forEach(cat => {
    cat.items.forEach(item => {
      if (allScores[item.no] === undefined) list.push(item);
    });
  });
  return list;
}

function updateFinalSummary(){
  const answered = Object.keys(allScores).length;

  const catAverages = categories.map(cat => {
    const vals = cat.items.map(item => allScores[item.no]).filter(v=>v!==undefined);
    if (vals.length === 0) return 0;
    const sum = vals.reduce((a,b)=>a+b,0);
    return sum / cat.items.length; // 0-5 scale (partial answers included as running average)
  });
  drawFinalRadar(catAverages);

  const totalAll = Object.values(allScores).reduce((a,b)=>a+b,0);
  document.getElementById("totalScoreAll").textContent = totalAll;

  const statusEl = document.getElementById("goStatus");
  if (answered < TOTAL_ITEMS){
    statusEl.textContent = "";
    const unanswered = getUnansweredItems();
    let html = `あと${unanswered.length}項目、回答してください。<br><br>`;
    if (unanswered.length <= 12){
      html += unanswered.map(item =>
        `<a href="#item-${item.no}" style="color:#FFD27F;text-decoration:underline;">▶ ${item.no}. ${item.name}</a>`
      ).join("<br>");
    } else {
      const byCat = {};
      unanswered.forEach(item => {
        const catNo = item.no.split("-")[0];
        byCat[catNo] = (byCat[catNo] || 0) + 1;
      });
      html += Object.keys(byCat).map(catNo => {
        const cat = categories.find(c => String(c.no) === catNo);
        return `<a href="#item-${catNo}-1" style="color:#FFD27F;text-decoration:underline;">▶ カテゴリ${catNo}（${cat ? cat.name : ""}）：あと${byCat[catNo]}項目</a>`;
      }).join("<br>");
    }
    document.getElementById("finalSummaryComment").innerHTML = html;
    return;
  }

  let statusLabel, statusClass;
  if (totalAll >= 220){ statusLabel = "GO"; statusClass = "go-good"; }
  else if (totalAll >= 165){ statusLabel = "要修正"; statusClass = "go-mid"; }
  else { statusLabel = "再検討"; statusClass = "go-bad"; }
  statusEl.textContent = statusLabel;
  statusEl.className = statusClass;

  const catTotals = categories.map((cat,idx) => ({
    no: cat.no, name: cat.name,
    total: cat.items.reduce((a,item)=>a+(allScores[item.no]||0),0)
  }));
  const sorted = [...catTotals].sort((a,b)=>a.total-b.total);
  const weakest = sorted.slice(0,3).filter(c => c.total <= 19);

  let msg = "";
  if (totalAll >= 220){
    msg = "発想段階の土台は非常に強固です。自信を持って次のフェーズ(コンセプト設計段階)に進んでください。";
  } else if (totalAll >= 165){
    msg = "全体としては良好ですが、点数の低いカテゴリに、あと一手間かける価値があります。";
  } else {
    msg = "一度、企画の出発点に立ち返ることをお勧めします。特に点数の低かったカテゴリから、優先的に見直してください。";
  }

  if (weakest.length){
    msg += `<br><br>特に見直しの優先度が高いのは、` + weakest.map(c => `「カテゴリ${c.no}：${c.name}」(${c.total}/25点)`).join("、") + ` です。`;
  }

  document.getElementById("finalSummaryComment").innerHTML = msg;
}

drawFinalRadar(new Array(categories.length).fill(0));
updateProgress();
</script>
